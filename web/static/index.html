<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>撲克牌辨識測試台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>♠ 撲克牌辨識測試台 <small>整張牌分割 → 轉正讀牌角 → 牌內切片 → 追蹤投票</small></h1>
  <div class="status">
    <span id="rec" class="pill rec" hidden>● 錄製中</span>
    <span id="perf" class="pill">— ms · — FPS</span>
    <span id="conn" class="pill off">未連線</span>
  </div>
</header>

<main>
  <section class="stage">
    <div class="toolbar">
      <div class="seg" role="tablist">
        <button id="modeCam" class="on">攝影機</button>
        <button id="modeImg">圖片</button>
        <button id="modeReplay">重播</button>
      </div>
      <span class="grp" data-mode="cam">
        <select id="camSel" title="攝影機"></select>
        <button id="pauseBtn" title="空白鍵">⏸ 暫停</button>
        <button id="recBtn" title="R：連續存下每一幀，供重播與回測（上限 60 秒）">● 錄製</button>
      </span>
      <span class="grp" data-mode="img" hidden>
        <label class="file">選擇圖片<input id="fileIn" type="file" accept="image/*" multiple></label>
      </span>
      <span class="grp" data-mode="replay" hidden>
        <select id="folderSel" title="影格資料夾"></select>
        <button id="playBtn" title="空白鍵">▶ 播放</button>
        <select id="speedSel" title="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="0">最快</option></select>
      </span>
      <label class="chk inline" title="框上畫兩個牌角的位置、牌內切片命中點、追蹤編號與驗證方式"><input id="debugChk" type="checkbox"> 除錯資訊</label>
    </div>
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted></video>
      <img id="still" alt="" hidden>
      <canvas id="overlay"></canvas>
      <div id="empty" class="empty">按「攝影機」允許鏡頭權限，或切到「圖片」上傳照片、「重播」看錄下的影格</div>
    </div>
    <div class="scrub" id="scrub" hidden>
      <input id="frameSlider" type="range" min="0" max="0" value="0">
      <span id="frameInfo" class="small muted">0 / 0</span>
    </div>
    <div class="thumbs" id="thumbs" hidden></div>
  </section>

  <aside>
    <div class="card hand-card">
      <h2>手牌 <span class="muted small" id="handInfo"></span></h2>
      <div id="hand" class="cards big">—</div>
      <div id="note" class="note"></div>
      <table class="segs" id="segTable">
        <thead><tr><th>#</th><th>牌值</th><th>信心</th><th>穩定</th><th>狀態</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>設定</h2>
      <label>分割信心門檻 <output id="confOut">0.50</output>
        <input id="conf" type="range" min="0.2" max="0.9" step="0.05" value="0.5"></label>
      <label>牌值顯示門檻 <output id="valueOut">0.60</output>
        <input id="valueMin" type="range" min="0.3" max="0.95" step="0.05" value="0.6"></label>
      <div class="grid2">
        <label class="chk" title="濾掉門、畫框、書櫃等長方形背景：框要有牌角讀值，且牌面夠白或牌值很有把握"><input id="verifyChk" type="checkbox" checked> 背景過濾</label>
        <label class="chk" title="沿轉正牌面四邊掃描，找疊在一起時後面那張牌的牌角"><input id="scanChk" type="checkbox" checked> 牌內切片</label>
        <label class="chk" title="依位置跨幀追蹤，牌值用信心加權、隨時間衰減的投票決定（圖片模式自動關閉）"><input id="smoothChk" type="checkbox" checked> 追蹤投票</label>
        <button id="resetBtn" class="small-btn" title="C">清除追蹤</button>
      </div>
    </div>

    <div class="card">
      <h2>回測 <span class="muted small" id="btFolder"></span></h2>
      <p class="muted small">用目前設定在伺服器端重播整個資料夾（依原始時間戳）。DEBUG 監看每 2 秒才存一幀，要驗證追蹤投票請用「錄製」。</p>
      <div class="capture">
        <select id="btSel"></select>
        <button id="btBtn">執行</button>
      </div>
      <div id="btOut" class="small"></div>
    </div>

    <div class="card">
      <h2>收集資料</h2>
      <label class="sub">回報誤判 <span class="muted small">E</span></label>
      <div class="capture">
        <input id="reportNote" placeholder="備註，例：Kc 被認成 As">
        <button id="reportBtn">回報</button>
      </div>
      <div id="reportMsg" class="small"></div>
      <label class="sub">存成測試照 <span class="muted small">S · <span id="rtCount"></span></span></label>
      <div class="capture">
        <input id="truth" placeholder="As-10h-Kd，沒牌寫 none">
        <button id="fillBtn" title="帶入目前手牌">↺</button>
        <button id="saveBtn" class="primary">存檔</button>
      </div>
      <div id="saveMsg" class="small"></div>
      <button id="evalBtn" class="small-btn">評估測試照（不追蹤、逐張比對）</button>
      <div id="evalOut" class="small"></div>
    </div>
  </aside>
</main>

<footer class="muted small">快捷鍵：空白 暫停／播放 · R 錄製 · S 存測試照 · E 回報誤判 · C 清除追蹤 · D 除錯資訊 · ←/→ 上一張／下一張</footer>
<script src="/static/app.js"></script>
</body>
</html>
