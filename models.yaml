# 本機模型登錄表。路徑相對於專案根目錄；檔案不存在時測試台會提示下載。
# 把各 Kaggle notebook 的輸出（out/<name>/）解壓到 models/<name>/ 即可。
# 舊的牌角路線（yolov8 牌角偵測、corner_cls 二次分類）已封存到 _archive/corner_route_v2/。

# 整張牌偵測（露出區域分割，kaggle/train_card_seg.ipynb 的輸出 out/card_seg/ 解壓到 models/card_seg/）
card_seg:
  weights: models/card_seg26_ft/best.pt  # 2026-11-25 改用 YOLO26n-seg 真牌微調版；回退：models/card_seg_ft/best.pt（v8 微調）、models/card_seg/best.pt（seg-2）
  imgsz: 640

# 轉正牌角的牌值分類（52 類＋none，kaggle/train_value_cls.ipynb 的輸出 out/value_cls/ 解壓到 models/value_cls/）
value_cls:
  weights: models/value_cls26_ft/best.pt  # 2026-11-26 改用 YOLO26s-cls 真牌微調版；回退：models/value_cls/best.pt（v8 微調）
  imgsz: 128
